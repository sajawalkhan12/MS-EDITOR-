name: Build MS Editor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT="."
          else
            ZIP_FILE=""

            for f in MS-Editor.zip MS-Editor-Android-Updated-Project.zip; do
              if [ -f "$f" ]; then
                ZIP_FILE="$f"
                break
              fi
            done

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project ZIP nahi mili."
              exit 1
            fi

            mkdir -p android-src
            unzip -oq "$ZIP_FILE" -d android-src

            SETTINGS=$(find android-src -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle file nahi mili."
              exit 1
            fi

            PROJECT=$(dirname "$SETTINGS")
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT"

      - name: Apply HTML update if available
        shell: bash
        run: |
          set -e

          HTML=""

          if [ -f "index.html" ]; then
            HTML="index.html"
          fi

          if [ -n "$HTML" ]; then
            mkdir -p "$PROJECT_DIR/app/src/main/assets"
            cp "$HTML" "$PROJECT_DIR/app/src/main/assets/index.html"
            echo "HTML update copied."
          else
            echo "No root index.html found; existing assets preserved."
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-Editor-Updated-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
