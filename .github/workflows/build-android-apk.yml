name: Build Updated MS Editor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # First, look for an Android project already in the repository.
          GRADLEW_FILE=$(find . -type f -name gradlew \
            -not -path './.git/*' | head -n 1 || true)

          if [ -n "$GRADLEW_FILE" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_FILE")
          else
            # Otherwise, extract an Android project ZIP if one exists.
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' \
              -not -path './.git/*' | head -n 1 || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project ya ZIP file nahi mili."
              exit 1
            fi

            mkdir -p android-src
            unzip -q "$ZIP_FILE" -d android-src

            GRADLEW_FILE=$(find android-src -type f -name gradlew \
              | head -n 1 || true)

            if [ -z "$GRADLEW_FILE" ]; then
              echo "ERROR: ZIP mein gradlew nahi mila."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$GRADLEW_FILE")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Apply HTML update if available
        shell: bash
        run: |
          set -e

          HTML_FILE=""

          if [ -f "index.html" ]; then
            HTML_FILE="index.html"
          else
            HTML_FILE=$(find . -maxdepth 3 -type f \
              -name 'MS-Editor-Media-Hub-Fixed.html' \
              -not -path './.git/*' | head -n 1 || true)
          fi

          if [ -n "$HTML_FILE" ]; then
            ASSETS_DIR="$PROJECT_DIR/app/src/main/assets"
            mkdir -p "$ASSETS_DIR"
            cp "$HTML_FILE" "$ASSETS_DIR/index.html"
            echo "HTML copied from $HTML_FILE"
          else
            echo "No HTML update found; keeping existing app assets."
          fi

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-Editor-Updated-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
