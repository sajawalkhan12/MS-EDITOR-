name: Build Updated MS Editor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          echo "Checking repository files..."

          if [ ! -f "MS-Editor.zip" ]; then
            echo "ERROR: MS-Editor.zip repository root mein nahi mili."
            echo "Android project ZIP ko repository root mein upload karein."
            exit 1
          fi

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html repository root mein nahi mili."
            echo "Updated HTML file ko index.html naam se upload karein."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p android-src
          unzip -q MS-Editor.zip -d android-src

          GRADLE_FILE=$(find android-src -name settings.gradle.kts \
            -o -name settings.gradle | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Android Gradle project nahi mila."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      - name: Apply updated HTML
        run: |
          ASSETS_DIR="$PROJECT_DIR/app/src/main/assets"
          mkdir -p "$ASSETS_DIR"

          cp index.html "$ASSETS_DIR/index.html"

          echo "Updated HTML copied successfully."

      - name: Set app name
        run: |
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="MS Editor Media Hub"/android:label="MS Editor"/' "$MANIFEST"
          fi

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: gradlew file nahi mili."
            echo "Android project mein Gradle wrapper shamil hona chahiye."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-Editor-Updated-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

### GitHub میں کہاں پیسٹ کرنا ہے؟

1. اپنی [MS Editor GitHub Repository](https://github.com/sajawalkhan12/ms-editor-media-hub-?utm_source=chatgpt.com) کھولیں۔
2. `.github/workflows/build-apk.yml` فائل کھولیں۔
3. Edit (✏️) دبائیں اور پرانا کوڈ ہٹا کر اوپر والا کوڈ پیسٹ کریں۔
4. **Commit changes** دبائیں۔
5. پھر **Actions** ٹیب میں جا کر build کا نتیجہ دیکھیں۔
6. کامیاب ہونے پر `MS-Editor-Updated-APK` artifact ڈاؤن لوڈ کریں۔

**اہم:** ریپوزٹری کے مرکزی فولڈر میں `MS-Editor.zip` اور درست شدہ `index.html` دونوں موجود ہونے چاہییں۔ اگر آپ کی ZIP کا نام مختلف ہے تو کوڈ میں اس کا اصل نام استعمال کریں۔ یہ workflow APK بنانے کے لیے ہے؛ بلیک اسکرین اور پوسٹس کا مسئلہ تبھی ٹھیک ہوگا جب `index.html` اور Android project میں اصل خرابی بھی درست ہو۔
