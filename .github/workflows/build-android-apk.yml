name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          unzip MS-Editor.zip -d android-src
          find android-src -name settings.gradle.kts

      - name: Build APK
        run: |
          cd android-src/ms-editor-media-hub-android-main
          sed -i 's/android:label="MS Editor Media Hub"/android:label="MS Editor"/' app/src/main/AndroidManifest.xml
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-Editor-APK
          path: android-src/ms-editor-media-hub-android-main/app/build/outputs/apk/debug/*.apk
